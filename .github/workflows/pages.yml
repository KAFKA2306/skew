name: Deploy Pages

on:
  pull_request:
    paths:
      - web/**
      - api/v1/defi/**
      - build_raw_evidence_view.py
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths:
      - web/**
      - api/v1/defi/**
      - build_raw_evidence_view.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build compact public evidence locator
        run: |
          python build_raw_evidence_view.py \
            --provenance api/v1/defi/provenance.json \
            --output /tmp/raw-evidence.json \
            --locators-output /tmp/evidence-locators.json
      - name: Validate complete-day semantics, locators and UI
        run: |
          python -m json.tool api/v1/defi/daily.json >/dev/null
          python -m json.tool api/v1/defi/aave-daily.json >/dev/null
          python -m json.tool api/v1/defi/index.json >/dev/null
          python -m json.tool api/v1/defi/contracts.json >/dev/null
          python -m json.tool /tmp/evidence-locators.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('api/v1/defi')
          idx=json.loads((root/'index.json').read_text())
          daily=json.loads((root/'daily.json').read_text())['records']
          aave=json.loads((root/'aave-daily.json').read_text())['records']
          provenance=json.loads((root/'provenance.json').read_text())
          loc=json.loads(Path('/tmp/evidence-locators.json').read_text())
          assert len(daily)==len(aave)==idx['coverage']['day_count']==loc['record_count']
          assert daily[-1]['date']==aave[-1]['date']==idx['coverage']['last_date']==loc['records'][-1]['date']
          assert all(x['aave_event_count']>=x['aave_liquidation_count']>=0 for x in daily)
          assert all(x['uniswap_swap_count']>=0 for x in daily)
          assert all(set(x['event_counts'])=={'supply','withdraw','borrow','repay','liquidation'} for x in aave)
          assert 'only complete UTC days' in idx['rules'][0]
          assert any('not labeled as USD volume' in x for x in idx['rules'])
          latest=loc['records'][-1]
          src=provenance['dates'][latest['date']]
          assert latest['from_block']==src['from_block'] and latest['to_block']==src['to_block']
          assert latest['start_boundary']['block_hash']==src['start_boundary']['block_hash']
          assert latest['end_boundary']['block_hash']==src['end_boundary']['block_hash']
          for section in ('start_boundary','end_boundary'):
              ref=latest[section]['raw_ref']
              assert ref['source_evidence_path'].startswith('raw/objects/') and len(ref['source_sha256'])==64
          for protocol in ('aave','uniswap'):
              assert latest[protocol]['raw_refs']
              assert all(r['source_evidence_path'].startswith('raw/objects/') and len(r['source_sha256'])==64 for r in latest[protocol]['raw_refs'])
          html=Path('web/index.html').read_text()
          for marker in ('FINALIZED ETHEREUM LOGS','Aave Supply','Aave Borrow','prior 7-day average','Latest day evidence','evidence-locators.json','Current partial UTC day is excluded'):
              assert marker in html, marker
          start=html.index('<script type="module">')+len('<script type="module">')
          end=html.index('</script>',start)
          Path('/tmp/dashboard.mjs').write_text(html[start:end])
          PY
          node --check /tmp/dashboard.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build public projection
        run: |
          rm -rf web/api/v1/defi
          mkdir -p web/api/v1/defi
          python build_raw_evidence_view.py \
            --provenance api/v1/defi/provenance.json \
            --output /tmp/raw-evidence.json \
            --locators-output web/api/v1/defi/evidence-locators.json
          cp api/v1/defi/daily.json web/api/v1/defi/daily.json
          cp api/v1/defi/aave-daily.json web/api/v1/defi/aave-daily.json
          cp api/v1/defi/index.json web/api/v1/defi/index.json
          cp api/v1/defi/contracts.json web/api/v1/defi/contracts.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('web/deployment.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA']},indent=2)+'\n')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact deployed revision, latest complete day and raw evidence locator
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.parse import urljoin
          from urllib.request import urlopen
          base=os.environ['PAGE_URL']; expected=os.environ['GITHUB_SHA']; last=None
          for _ in range(30):
              try:
                  with urlopen(urljoin(base,'deployment.json'),timeout=10) as r: dep=json.load(r)
                  with urlopen(urljoin(base,'api/v1/defi/index.json'),timeout=10) as r: idx=json.load(r)
                  with urlopen(urljoin(base,'api/v1/defi/daily.json'),timeout=10) as r: daily=json.load(r)
                  with urlopen(urljoin(base,'api/v1/defi/aave-daily.json'),timeout=10) as r: aave=json.load(r)
                  with urlopen(urljoin(base,'api/v1/defi/evidence-locators.json'),timeout=10) as r: loc=json.load(r)
                  with urlopen(base,timeout=10) as r: html=r.read().decode()
                  assert dep['source_commit']==expected, dep
                  latest=loc['records'][-1]
                  assert daily['records'][-1]['date']==aave['records'][-1]['date']==idx['coverage']['last_date']==latest['date']
                  assert loc['record_count']==idx['coverage']['day_count']
                  assert latest['from_block']<=latest['to_block']
                  assert len(latest['start_boundary']['block_hash'])==66 and len(latest['end_boundary']['block_hash'])==66
                  assert all(len(r['source_sha256'])==64 for r in latest['aave']['raw_refs']+latest['uniswap']['raw_refs'])
                  assert 'Aave Supply' in html and 'Latest day evidence' in html and 'evidence-locators.json' in html
                  print({'page_url':base,'source_commit':expected,'latest_day':latest['date'],'from_block':latest['from_block'],'to_block':latest['to_block'],'aave_raw_refs':len(latest['aave']['raw_refs']),'uniswap_raw_refs':len(latest['uniswap']['raw_refs'])})
                  break
              except Exception as exc:
                  last=exc; time.sleep(2)
          else:
              raise SystemExit(f'production verification failed: {last}')
          PY
      - name: Record production evidence on Issue 17
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          base=os.environ['PAGE_URL']; sha=os.environ['GITHUB_SHA']; token=os.environ['GH_TOKEN']; repo=os.environ['REPOSITORY']
          marker=f'<!-- pages-production:{sha} -->'
          with urlopen(urljoin(base,'api/v1/defi/index.json'),timeout=10) as r: idx=json.load(r)
          with urlopen(urljoin(base,'api/v1/defi/aave-daily.json'),timeout=10) as r: aave=json.load(r)
          with urlopen(urljoin(base,'api/v1/defi/daily.json'),timeout=10) as r: daily=json.load(r)
          with urlopen(urljoin(base,'api/v1/defi/evidence-locators.json'),timeout=10) as r: loc=json.load(r)
          latest=loc['records'][-1]; ad=aave['records'][-1]; dd=daily['records'][-1]
          api=f'https://api.github.com/repos/{repo}/issues/17/comments?per_page=100'
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'defi-pages-production-evidence'}
          with urlopen(Request(api,headers=headers),timeout=15) as r: comments=json.load(r)
          if any(marker in item.get('body','') for item in comments):
              print('Production evidence already recorded for',sha); raise SystemExit(0)
          counts=ad['event_counts']
          body='\n'.join([
              marker,'### Pages production verified','',
              f'- source commit: `{sha}`',f'- page: {base}',
              f"- latest complete UTC day: `{latest['date']}`",
              f"- finalized block range: `{latest['from_block']}` → `{latest['to_block']}`",
              f"- Aave counts: Supply `{counts['supply']}`, Withdraw `{counts['withdraw']}`, Borrow `{counts['borrow']}`, Repay `{counts['repay']}`, LiquidationCall `{counts['liquidation']}`",
              f"- Uniswap swaps: `{dd['uniswap_swap_count']}`",
              f"- raw evidence refs for latest day: Aave `{len(latest['aave']['raw_refs'])}`, Uniswap `{len(latest['uniswap']['raw_refs'])}`, plus start/end boundary refs",
              f"- canonical coverage: `{idx['coverage']['day_count']}` complete days / `{idx['coverage']['raw_evidence_count']}` raw evidence objects",'',
              'Evidence was written only after the workflow verified `deployment.json.source_commit` against this exact SHA and read the production canonical JSON, daily evidence locator and root HTML successfully.'
          ])
          post=Request(api,data=json.dumps({'body':body}).encode(),headers={**headers,'Content-Type':'application/json'},method='POST')
          with urlopen(post,timeout=15) as r: print('Recorded production evidence:',r.status)
          PY

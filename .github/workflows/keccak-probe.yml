name: Keccak probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve ABI hashes
        run: |
          python - <<'PY'
          import json, urllib.request
          endpoints=['https://cloudflare-eth.com','https://ethereum-rpc.publicnode.com','https://rpc.flashbots.net','https://eth.drpc.org']
          signatures=[
            'getPool()','getPool(address,address,uint24)','token0()','token1()','decimals()',
            'Supply(address,address,address,uint256,uint16)',
            'Withdraw(address,address,address,uint256)',
            'Borrow(address,address,address,uint256,uint8,uint256,uint16)',
            'Repay(address,address,address,uint256,bool)',
            'LiquidationCall(address,address,address,uint256,uint256,address,bool)',
            'Swap(address,address,int256,int256,uint160,uint128,int24)'
          ]
          def sha3(url,sig):
            body={'jsonrpc':'2.0','id':sig,'method':'web3_sha3','params':['0x'+sig.encode().hex()]}
            req=urllib.request.Request(url,data=json.dumps(body).encode(),headers={'Content-Type':'application/json','User-Agent':'KAFKA2306/defi'},method='POST')
            with urllib.request.urlopen(req,timeout=20) as r: payload=json.loads(r.read())
            if payload.get('error'): raise RuntimeError(payload['error'])
            return payload['result']
          for url in endpoints:
            try:
              values={sig:sha3(url,sig) for sig in signatures}
              print('FULL_OK',url)
              for sig,value in values.items(): print(sig,value,value[:10])
            except Exception as exc:
              print('FAIL',url,type(exc).__name__,str(exc))
          PY

name: Creator Export Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Creator export contract
        run: npm test
      - name: Production build
        run: npm run build
      - name: Remove generated build outputs
        run: rm -rf dist .tmp-test
      - name: Clean checkout gate
        run: test -z "$(git status --porcelain)"
